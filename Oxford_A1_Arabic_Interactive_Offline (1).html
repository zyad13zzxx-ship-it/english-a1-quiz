let questions=[],i=0,score=0,answered=false;
const app=document.getElementById('app');
function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function start(){questions=shuffle(DATA);i=0;score=0;showQ()}
function showStart(){app.innerHTML=`<div class="start"><h1>اختبار Oxford 3000 — A1</h1><p class="muted">English → عربي</p><div class="features">✓ جميع الكلمات الموجودة في القائمة<br>✓ لكل كلمة 4 خيارات عربية<br>✓ تصحيح فوري وحساب الدرجة<br>✓ ترتيب عشوائي في كل مرة<br>✓ يعمل بدون إنترنت بعد فتح الملف</div><button class="btn primary" onclick="start()">ابدأ الاختبار</button><p class="small" style="text-align:center;margin-top:14px">عدد الكلمات: ${DATA.length}</p></div>`}
function showQ(){answered=false;const [word,correct]=questions[i];let pool=DATA.filter(x=>x[1]!==correct).map(x=>x[1]);let opts=shuffle([correct,...shuffle(pool).slice(0,3)]);app.innerHTML=`<div class="stats"><span class="pill">السؤال ${i+1} من ${questions.length}</span><span class="pill">الدرجة: ${score}</span></div><div class="progress"><div class="bar" style="width:${i/questions.length*100}%"></div></div><div class="qnum">ما معنى الكلمة التالية؟</div><div class="word">${esc(word)}</div><div class="opts">${opts.map((o,n)=>`<button class="opt" data-answer="${enc(o)}" onclick="answer(this,${JSON.stringify(correct)})">${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="btn primary" style="display:none" onclick="nextQ()">السؤال التالي</button></div>`}
function answer(btn,correct){if(answered)return;answered=true;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);const chosen=btn.getAttribute('data-answer');if(chosen===correct){score++;btn.classList.add('correct');document.getElementById('feedback').textContent='✓ إجابة صحيحة';}else{btn.classList.add('wrong');document.querySelectorAll('.opt').forEach(b=>{if(b.getAttribute('data-answer')===correct)b.classList.add('correct')});document.getElementById('feedback').textContent='✗ الإجابة الصحيحة: '+correct}document.getElementById('next').style.display='block';document.querySelector('.bar').style.width=((i+1)/questions.length*100)+'%'}
function nextQ(){i++;if(i>=questions.length)showResult();else showQ()}
function showResult(){let pct=Math.round(score/questions.length*100);app.innerHTML=`<div class="result"><h1>انتهى الاختبار 🎉</h1><div class="score">${score} / ${questions.length}</div><h2>${pct}%</h2><p>أعد الاختبار لتغيير ترتيب الأسئلة والخيارات.</p><button class="btn primary" onclick="start()">إعادة الاختبار</button></div>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function enc(x){return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
showStart();
</script></body></html>
